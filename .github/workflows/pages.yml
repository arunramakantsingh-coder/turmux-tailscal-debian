name: Build and publish Alpha7A

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/**"
      - "alpha7a/**"
      - "site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha7a-build
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare Alpha7A provisioning payload
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -Eeuo pipefail
          test -n "$TAILSCALE_AUTHKEY" || { echo "::error::TAILSCALE_AUTHKEY secret is missing"; exit 1; }
          case "$TAILSCALE_AUTHKEY" in
            tskey-auth-*) ;;
            *) echo "::error::TAILSCALE_AUTHKEY does not look like a Tailscale auth key"; exit 1 ;;
          esac
          mkdir -p alpha7a/app/src/main/assets
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = Path("bootstrap/setup.sh").read_text()
          marker = "__ALPHA7A_TAILSCALE_AUTHKEY__"
          key = os.environ["TAILSCALE_AUTHKEY"]
          if marker not in source:
              raise SystemExit("Expected auth-key marker missing from bootstrap/setup.sh")
          Path("alpha7a/app/src/main/assets/setup.sh").write_text(source.replace(marker, key))
          print("Provisioning payload prepared with the GitHub Actions secret.")
          PY

      - name: Build Alpha7A APK
        run: |
          set -Eeuo pipefail
          gradle -p alpha7a --no-daemon :app:assembleDebug
          VERSION="$(grep -E "versionName" alpha7a/app/build.gradle | head -1 | sed -E "s/.*'([^']*)'.*/\1/")"
          test -n "$VERSION" || { echo "::error::could not read versionName from alpha7a/app/build.gradle"; exit 1; }
          APK_NAME="android-development-appliance-v${VERSION}.apk"
          BUILD_SHA="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u '+%Y-%m-%dT%H:%MZ')"
          mkdir -p site
          cp alpha7a/app/build/outputs/apk/debug/app-debug.apk "site/$APK_NAME"
          ( cd site && sha256sum "$APK_NAME" > "$APK_NAME.sha256" )
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "BUILD_SHA=$BUILD_SHA" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"
          echo "Published $APK_NAME (build $BUILD_SHA)"

      - name: Build private distribution page
        run: |
          set -Eeuo pipefail
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Alpha7A — Android Development Appliance</title>
          <style>
          body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:820px;margin:auto;padding:22px;background:#0b1020;color:#eef2ff;line-height:1.5}
          .card{background:#151c33;border:1px solid #303a60;border-radius:16px;padding:20px;margin:16px 0}
          .muted{color:#aab4d0}.btn{display:inline-block;border-radius:11px;padding:13px 18px;margin:6px 4px 6px 0;background:#4f7cff;color:white;text-decoration:none;font-weight:700}
          .ok{border-left:4px solid #45d483}.warn{border-left:4px solid #ffbd4a} code,pre{background:#080d18;border-radius:10px;padding:10px}
          .meta{color:#aab4d0;font-size:14px}
          </style></head><body>
          <h1>Alpha7A</h1><div class="muted">Lightweight Android Development Appliance • Model A • v__VERSION__</div>
          <div class="card ok"><h2>Build available</h2>
          <p class="meta">Code name <b>Alpha7A</b> • Version <b>v__VERSION__</b> • Build <code>__BUILD_SHA__</code> • Published __BUILD_DATE__</p>
          <p>This is a private test build. Keep the APK and its embedded Tailscale auth key within your trusted devices.</p>
          <a class="btn" href="./__APK_NAME__">Download Alpha7A v__VERSION__ APK</a>
          <a class="btn" href="./__APK_NAME__.sha256">SHA-256</a></div>
          <div class="card"><h2>First-time setup</h2><ol>
          <li>Install the official Termux app. Alpha7A downloads it for you: tap “1. Install official Termux” and approve the install in the Android package installer. F-Droid is an alternative source; do not mix Termux sources.</li>
          <li>Install and open Alpha7A.</li><li>Allow Termux external commands and grant Alpha7A the Termux RUN_COMMAND permission.</li>
          <li>Tap START ALPHA7A PROVISIONING. The build supplies the configured Tailscale auth key automatically.</li></ol></div>
          <div class="card"><h2>Provisioned services</h2><p>Termux tools, Tailscale userspace, unique hostname, SSH on 8022, Debian via proot-distro, Debian SSH on 2222, SOCKS5 on 1055, local operations page on 8080, Git/Git LFS/Python/build tooling and diagnostics.</p></div>
          <div class="card warn"><b>Android restriction:</b> Android still requires user confirmation to install an APK and Termux security approvals before a third-party app can run commands in Termux.</div>
          </body></html>
          HTML
          sed -i \
            -e "s/__VERSION__/$VERSION/g" \
            -e "s/__BUILD_SHA__/$BUILD_SHA/g" \
            -e "s/__BUILD_DATE__/$BUILD_DATE/g" \
            -e "s/__APK_NAME__/$APK_NAME/g" \
            site/index.html
          if grep -q '__[A-Z_][A-Z_]*__' site/index.html; then
            echo "::error::unresolved placeholder left in site/index.html"; exit 1
          fi
          echo "Page shows Alpha7A v$VERSION (build $BUILD_SHA)"

      - name: Publish site and APK to private distribution repository
        if: github.event_name != 'pull_request'
        env:
          DISTRIBUTION_TOKEN: ${{ secrets.DISTRIBUTION_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$DISTRIBUTION_TOKEN"
          rm -rf distribution
          git clone "https://x-access-token:${DISTRIBUTION_TOKEN}@github.com/arunramakantsingh-coder/turmux-tailscal-debian-download.git" distribution
          find distribution -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a site/. distribution/
          cd distribution
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No distribution changes."; exit 0; fi
          git commit -m "release: publish Alpha7A v${VERSION} appliance"
          git push origin main

      - name: Upload Alpha7A APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-development-appliance-v${{ env.VERSION }}
          path: |
            site/android-development-appliance-v${{ env.VERSION }}.apk
            site/android-development-appliance-v${{ env.VERSION }}.apk.sha256
