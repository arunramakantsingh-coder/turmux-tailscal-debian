name: Build and publish Alpha7A

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/**"
      - "alpha7a/**"
      - "site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha7a-build
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare Alpha7A provisioning payload
        run: |
          set -Eeuo pipefail
          mkdir -p alpha7a/app/src/main/assets
          cp bootstrap/setup.sh alpha7a/app/src/main/assets/setup.sh

      - name: Build Alpha7A APK
        run: |
          set -Eeuo pipefail
          gradle -p alpha7a --no-daemon :app:assembleDebug
          mkdir -p site
          cp alpha7a/app/build/outputs/apk/debug/app-debug.apk site/android-development-appliance-v0.5.0-alpha.7a.apk
          sha256sum site/android-development-appliance-v0.5.0-alpha.7a.apk > site/android-development-appliance-v0.5.0-alpha.7a.apk.sha256

      - name: Build public distribution page
        run: |
          set -Eeuo pipefail
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Alpha7A — Android Development Appliance</title>
          <style>
          body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:820px;margin:auto;padding:22px;background:#0b1020;color:#eef2ff;line-height:1.5}
          .card{background:#151c33;border:1px solid #303a60;border-radius:16px;padding:20px;margin:16px 0}
          .muted{color:#aab4d0}.btn{display:inline-block;border-radius:11px;padding:13px 18px;margin:6px 4px 6px 0;background:#4f7cff;color:white;text-decoration:none;font-weight:700}
          .ok{border-left:4px solid #45d483}.warn{border-left:4px solid #ffbd4a} code,pre{background:#080d18;border-radius:10px;padding:10px}
          </style></head><body>
          <h1>Alpha7A</h1>
          <div class="muted">Lightweight Android Development Appliance • Model A • v0.5.0-alpha.7a</div>
          <div class="card ok"><h2>Test build is ready</h2>
          <p>Alpha7A uses the maintained Termux application as the runtime and a small companion APK as the provisioning controller.</p>
          <a class="btn" href="./android-development-appliance-v0.5.0-alpha.7a.apk">Download Alpha7A APK</a>
          <a class="btn" href="./android-development-appliance-v0.5.0-alpha.7a.apk.sha256">SHA-256</a></div>
          <div class="card"><h2>Required first-time setup</h2><ol>
          <li>Install the official Termux build from the same source you intend to keep using (GitHub or F-Droid). Do not mix Termux sources.</li>
          <li>Install Alpha7A.</li>
          <li>Open Alpha7A and follow its two security approvals: enable <code>allow-external-apps=true</code> in Termux and grant Alpha7A the Termux <code>RUN_COMMAND</code> permission.</li>
          <li>Tap <b>START ALPHA7A PROVISIONING</b> once.</li>
          </ol></div>
          <div class="card"><h2>What it provisions</h2>
          <p>Termux baseline tools, Tailscale userspace, unique hostname, SSH on 8022, Debian via proot-distro, Debian SSH on 2222, proxy Level 1/2, SOCKS5 on 1055, local details/operations page on port 8080, Git/Git LFS/Python/build tooling and diagnostics.</p></div>
          <div class="card warn"><b>Important:</b> Android and Termux deliberately require these security approvals for a third-party app to execute commands in Termux. This is why Alpha7A cannot honestly claim zero-touch provisioning on a normal stock Android device. The actual provisioning after approval is automatic.</div>
          <div class="card"><h2>Alpha7A vs Alpha7B</h2><p><b>Alpha7A</b> = lightweight companion + official Termux. <b>Alpha7B</b> = self-contained custom Termux build and remains preserved as the alternate track.</p></div>
          <div class="card"><h2>Security</h2><p>The Tailscale auth key is entered on the device during first-run provisioning. It is not embedded in the APK or published to the repository. The key is stored locally with restricted permissions and removed after successful authentication.</p></div>
          </body></html>
          HTML

      - name: Publish site and APK to public distribution repository
        if: github.event_name != 'pull_request'
        env:
          DISTRIBUTION_TOKEN: ${{ secrets.DISTRIBUTION_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$DISTRIBUTION_TOKEN"
          rm -rf distribution
          git clone "https://x-access-token:${DISTRIBUTION_TOKEN}@github.com/arunramakantsingh-coder/turmux-tailscal-debian-download.git" distribution

          # Preserve the public repository's own Pages workflow.
          find distribution -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a site/. distribution/

          cd distribution
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No distribution changes."
            exit 0
          fi
          git commit -m "release: publish alpha.7a appliance"
          git push origin main

      - name: Upload Alpha7A APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-development-appliance-v0.5.0-alpha.7a
          path: |
            site/android-development-appliance-v0.5.0-alpha.7a.apk
            site/android-development-appliance-v0.5.0-alpha.7a.apk.sha256
