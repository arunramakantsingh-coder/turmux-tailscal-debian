name: Build and publish appliance

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/**"
      - "site/**"
      - "provisioner/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appliance-build
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Termux build SDK
        run: |
          sdkmanager "platforms;android-30" "build-tools;30.0.3" "ndk;22.1.7171670"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Build custom Termux appliance
        env:
          BOOTSTRAP_REF: ${{ github.sha }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          chmod +x provisioner/build-custom-termux.sh
          ./provisioner/build-custom-termux.sh

      - name: Publish site and APK to public distribution repository
        env:
          DISTRIBUTION_TOKEN: ${{ secrets.DISTRIBUTION_TOKEN }}
        run: |
          set -Eeuo pipefail

          rm -rf distribution
          git clone "https://x-access-token:${DISTRIBUTION_TOKEN}@github.com/arunramakantsingh-coder/turmux-tailscal-debian-download.git" distribution

          find distribution -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a site/. distribution/

          cd distribution
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No distribution changes."
            exit 0
          fi

          git commit -m "release: publish alpha.7 appliance"
          git push origin main

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-development-appliance-v0.5.0-alpha.7
          path: site/android-development-appliance-v0.5.0-alpha.7.apk
