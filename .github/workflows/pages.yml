name: Build and publish appliance

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/**"
      - "site/**"
      - "provisioner/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appliance-build
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Termux build SDK
        run: |
          sdkmanager "platforms;android-30" "build-tools;30.0.3" "ndk;22.1.7171670"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Build custom Termux appliance
        env:
          BOOTSTRAP_REF: ${{ github.sha }}
        run: |
          chmod +x provisioner/build-custom-termux.sh
          ./provisioner/build-custom-termux.sh

      # Defence in depth before anything crosses into the public repo.
      # The APK is distributed publicly, so it must never carry a
      # credential. Provisioning asks for the Tailscale auth key on first
      # run instead of baking it in.
      - name: Verify no secrets in publishable artifacts
        run: |
          set -Eeuo pipefail
          fail=0
          pattern='tskey-[a-z]+-[A-Za-z0-9]{6,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN [A-Z ]*PRIVATE KEY'
          if grep -rIlE "$pattern" site/ 2>/dev/null; then
            echo "::error::Credential-shaped string found in site/; refusing to publish."
            fail=1
          fi
          if ! python3 - <<'PY'
          import re, sys, zipfile, glob
          pats = [rb"tskey-[a-z]+-[A-Za-z0-9]{6,}", rb"gh[pousr]_[A-Za-z0-9]{20,}",
                  rb"github_pat_[A-Za-z0-9_]{20,}", rb"BEGIN [A-Z ]*PRIVATE KEY"]
          bad = []
          for apk in glob.glob("site/*.apk"):
              with zipfile.ZipFile(apk) as z:
                  for i in z.infolist():
                      try:
                          d = z.read(i.filename)
                      except Exception:
                          continue
                      for p in pats:
                          if re.search(p, d):
                              bad.append(f"{apk}!{i.filename}")
          if bad:
              print("secrets found inside APK: " + ", ".join(sorted(set(bad))), file=sys.stderr)
              sys.exit(1)
          print("APK secret scan: PASS")
          PY
          then
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1

      - name: Publish site and APK to public distribution repository
        env:
          DISTRIBUTION_TOKEN: ${{ secrets.DISTRIBUTION_TOKEN }}
        run: |
          set -Eeuo pipefail

          rm -rf distribution
          git clone "https://x-access-token:${DISTRIBUTION_TOKEN}@github.com/arunramakantsingh-coder/turmux-tailscal-debian-download.git" distribution

          find distribution -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a site/. distribution/

          cd distribution
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No distribution changes."
            exit 0
          fi

          git commit -m "release: publish appliance (no embedded credentials)"
          git push origin main

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-development-appliance-v0.5.0-alpha.7
          path: site/android-development-appliance-v0.5.0-alpha.7.apk
