name: Build and deploy appliance

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/**"
      - "site/**"
      - "provisioner/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Termux build SDK
        run: |
          sdkmanager "platforms;android-30" "build-tools;30.0.3" "ndk;22.1.7171670"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Build custom Termux appliance
        env:
          BOOTSTRAP_REF: ${{ github.sha }}
        run: |
          chmod +x provisioner/build-custom-termux.sh
          ./provisioner/build-custom-termux.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-development-appliance-v0.5.0-alpha.5
          path: site/android-development-appliance-v0.5.0-alpha.5.apk
