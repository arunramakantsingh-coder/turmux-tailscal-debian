name: Build and publish Alpha7A

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/**"
      - "alpha7a/**"
      - "site/**"
      - "CHANGELOG.md"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha7a-build
  cancel-in-progress: true

env:
  DISTRIBUTION_REPO: arunramakantsingh-coder/turmux-tailscal-debian-download

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Validate repository
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck >/dev/null
          shellcheck --severity=error bootstrap/setup.sh bootstrap/install.sh
          bash tests/validate.sh

      - name: Prepare Alpha7A provisioning payload
        run: |
          set -Eeuo pipefail
          mkdir -p alpha7a/app/src/main/assets
          cp bootstrap/setup.sh alpha7a/app/src/main/assets/setup.sh
          # The payload is shipped in a public APK, so it must never carry a secret.
          if grep -qE 'tskey-auth-[A-Za-z0-9]{8,}' alpha7a/app/src/main/assets/setup.sh; then
            echo "::error::the provisioning payload contains a Tailscale auth key"
            exit 1
          fi
          echo "Provisioning payload prepared without any secret."

      - name: Build Alpha7A APK
        run: |
          set -Eeuo pipefail
          gradle -p alpha7a --no-daemon :app:assembleDebug
          VERSION="$(grep -E "versionName" alpha7a/app/build.gradle | head -1 | sed -E "s/.*'([^']*)'.*/\1/")"
          VERSION_CODE="$(grep -E "versionCode" alpha7a/app/build.gradle | head -1 | sed -E "s/.*versionCode[[:space:]]+([0-9]+).*/\1/")"
          test -n "$VERSION" || { echo "::error::could not read versionName from alpha7a/app/build.gradle"; exit 1; }
          test -n "$VERSION_CODE" || { echo "::error::could not read versionCode from alpha7a/app/build.gradle"; exit 1; }
          APK_NAME="android-development-appliance-v${VERSION}.apk"
          BUILD_SHA="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u '+%Y-%m-%dT%H:%MZ')"
          mkdir -p site
          cp alpha7a/app/build/outputs/apk/debug/app-debug.apk "site/$APK_NAME"
          ( cd site && sha256sum "$APK_NAME" > "$APK_NAME.sha256" )
          APK_SHA256="$(cut -d' ' -f1 < "site/$APK_NAME.sha256")"

          # The version code must always increase, so a published build is never replaced
          # by an older one.
          PUBLISHED_VERSION_CODE="$(curl -fsSL "https://raw.githubusercontent.com/${DISTRIBUTION_REPO}/main/release.json" 2>/dev/null \
            | grep -o '"versionCode"[[:space:]]*:[[:space:]]*[0-9]*' | grep -o '[0-9]*' || true)"
          PUBLISHED_VERSION_CODE="${PUBLISHED_VERSION_CODE:-0}"
          if [ "$VERSION_CODE" -le "$PUBLISHED_VERSION_CODE" ]; then
            echo "::error::versionCode $VERSION_CODE must be higher than the published $PUBLISHED_VERSION_CODE"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "APK_SHA256=$APK_SHA256" >> "$GITHUB_ENV"
          echo "BUILD_SHA=$BUILD_SHA" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"
          echo "Built $APK_NAME (versionCode $VERSION_CODE, build $BUILD_SHA)"

      - name: Write release metadata
        run: |
          set -Eeuo pipefail
          CHANGELOG=""
          if [ -f CHANGELOG.md ]; then
            CHANGELOG="$(awk 'BEGIN{s=0} /^## /{s++; next} s==1{print} s>=2{exit}' CHANGELOG.md)"
          fi
          CHANGELOG_JSON="$(printf '%s' "$CHANGELOG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')"
          cat > site/release.json <<EOF
          {
            "versionName": "$VERSION",
            "versionCode": $VERSION_CODE,
            "sourceCommit": "$GITHUB_SHA",
            "sourceCommitShort": "$BUILD_SHA",
            "buildTimestampUtc": "$BUILD_DATE",
            "workflowRun": "$GITHUB_RUN_ID",
            "workflowUrl": "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID",
            "apkFileName": "$APK_NAME",
            "sha256": "$APK_SHA256",
            "changeSummary": $CHANGELOG_JSON
          }
          EOF
          python3 -c 'import json;json.load(open("site/release.json"))' || { echo "::error::release.json is not valid JSON"; exit 1; }
          echo "Release metadata written."

      - name: Build private distribution page
        run: |
          set -Eeuo pipefail
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Alpha7A — Android Development Appliance</title>
          <style>
          body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:820px;margin:auto;padding:22px;background:#0b1020;color:#eef2ff;line-height:1.5}
          .card{background:#151c33;border:1px solid #303a60;border-radius:16px;padding:20px;margin:16px 0}
          .muted{color:#aab4d0}.btn{display:inline-block;border-radius:11px;padding:13px 18px;margin:6px 4px 6px 0;background:#4f7cff;color:white;text-decoration:none;font-weight:700}
          .ok{border-left:4px solid #45d483}.warn{border-left:4px solid #ffbd4a} code,pre{background:#080d18;border-radius:10px;padding:10px}
          .meta{color:#aab4d0;font-size:14px}
          </style></head><body>
          <h1>Alpha7A</h1><div class="muted">Lightweight Android Development Appliance • Model A • v__VERSION__</div>
          <div class="card ok"><h2>Build available</h2>
          <p class="meta">Code name <b>Alpha7A</b> • Version <b>v__VERSION__</b> (versionCode __VERSION_CODE__) • Build <code>__BUILD_SHA__</code> • Published __BUILD_DATE__</p>
          <p class="meta">Source commit <code>__SOURCE_COMMIT__</code> • Workflow run <code>__RUN_ID__</code></p>
          <p>This is a private test build. No Tailscale auth key is embedded in it: paste the key in the app when you need one.</p>
          <a class="btn" href="./__APK_NAME__">Download Alpha7A v__VERSION__ APK</a>
          <a class="btn" href="./__APK_NAME__.sha256">SHA-256</a>
          <a class="btn" href="./release.json">Release metadata</a></div>
          <div class="card"><h2>What changed</h2>
          <pre>__CHANGELOG__</pre></div>
          <div class="card"><h2>First-time setup</h2><ol>
          <li>Install the official Termux app. Alpha7A downloads it for you: tap “Install official Termux” and approve the install in the Android package installer. F-Droid is an alternative source; do not mix Termux sources.</li>
          <li>Install and open Alpha7A.</li><li>Allow Termux external commands and grant Alpha7A the Termux RUN_COMMAND permission.</li>
          <li>Tap START PROVISIONING. Alpha7A runs the whole setup inside Termux and shows the progress and the result.</li></ol></div>
          <div class="card"><h2>Provisioned services</h2><p>Termux tools, Tailscale (official app or the CLI in Termux), unique hostname, Termux SSH, Debian via proot-distro, Debian SSH, SOCKS5, local operations page, Git/Git LFS/Python/build tooling and diagnostics. The ports and accounts are set in the app.</p></div>
          <div class="card warn"><b>Android restriction:</b> Android still requires user confirmation to install an APK, and Termux requires the user to allow external apps to run commands.</div>
          </body></html>
          HTML
          python3 - <<'PY'
          import os, pathlib, re
          page = pathlib.Path("site/index.html")
          html = page.read_text(encoding="utf-8")
          values = {
              "__VERSION__": os.environ["VERSION"],
              "__VERSION_CODE__": os.environ["VERSION_CODE"],
              "__BUILD_SHA__": os.environ["BUILD_SHA"],
              "__BUILD_DATE__": os.environ["BUILD_DATE"],
              "__APK_NAME__": os.environ["APK_NAME"],
              "__SOURCE_COMMIT__": os.environ["GITHUB_SHA"],
              "__RUN_ID__": os.environ["GITHUB_RUN_ID"],
          }
          changelog = []
          changelog_file = pathlib.Path("CHANGELOG.md")
          if changelog_file.exists():
              started = False
              for line in changelog_file.read_text(encoding="utf-8").splitlines():
                  if line.startswith("## "):
                      if started:
                          break
                      started = True
                      continue
                  if started:
                      changelog.append(line)
          values["__CHANGELOG__"] = "\n".join(
              ("- " + line) if line.strip() else "" for line in "\n".join(changelog).strip().splitlines())
          for key, value in values.items():
              html = html.replace(key, value)
          left = sorted(set(re.findall(r"__[A-Z_]+__", html)))
          if left:
              raise SystemExit("unresolved placeholder(s) in site/index.html: " + ", ".join(left))
          page.write_text(html, encoding="utf-8")
          print("Page rendered for Alpha7A v" + values["__VERSION__"])
          PY

      - name: Publish site and APK to private distribution repository
        if: github.event_name != 'pull_request'
        env:
          DISTRIBUTION_TOKEN: ${{ secrets.DISTRIBUTION_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$DISTRIBUTION_TOKEN"
          rm -rf distribution
          git clone "https://x-access-token:${DISTRIBUTION_TOKEN}@github.com/${DISTRIBUTION_REPO}.git" distribution
          find distribution -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a site/. distribution/
          cd distribution
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No distribution changes."; exit 0; fi
          git commit -m "release: Alpha7A v${VERSION} (versionCode ${VERSION_CODE}) from ${GITHUB_SHA} run ${GITHUB_RUN_ID}"
          git push origin main

      - name: Upload Alpha7A APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-development-appliance-v${{ env.VERSION }}
          path: |
            site/android-development-appliance-v${{ env.VERSION }}.apk
            site/android-development-appliance-v${{ env.VERSION }}.apk.sha256
            site/release.json
